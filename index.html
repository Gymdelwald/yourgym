<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#151A24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YOURGYM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64-v2.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YOURGYM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#151A24;--surface:#1E2532;--stage:#252D3B;--ink:#E7E5DD;--muted:#9CA3B2;
  --plate:#F0B323;--sage:#6DB287;--oxide:#E3714F;--line:rgba(231,229,221,.14);--far:rgba(231,229,221,.36);--off:#4A5469;--sil:#343D50;
  --fig:#E7E5DD;--feat:#5C6780;--wdb:#6B7896;--on-plate:#1E2940;--plate-t:var(--plate);--plate-m:var(--plate);--hov:rgba(255,255,255,.08);--hov2:rgba(255,255,255,.12);
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html[data-theme="light"]{--bg:#F3F1EC;--surface:#FFFFFF;--stage:#E7EAF0;--ink:#1F2533;--muted:#5D6575;--line:rgba(31,37,51,.16);--far:rgba(31,37,51,.36);--off:#C5CBD6;--sil:#DDE1E8;--fig:#3A4254;--feat:#98A1B2;--wdb:#9AA3B6;--hov:rgba(0,0,0,.05);--hov2:rgba(0,0,0,.08);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:560px;margin:0 auto;padding:18px 18px 112px}
body.in-session #app{padding-bottom:28px}
body.in-session .row:has(> .btn + .btn){flex-direction:column;align-items:stretch}
body.in-session .row:has(> .btn + .btn)>.btn{flex:none!important;width:100%}
body.in-session .row:has(> .btn + .btn)>.btn.primary{order:-1}
body.in-session .tabs,body.in-onb .tabs,body.in-onb .gear{display:none}
.onb-dots{display:flex;gap:8px;justify-content:center;margin:8px 0 4px}
.onb-dots i{width:8px;height:8px;border-radius:50%;background:var(--off)}
.onb-dots i.on{background:var(--plate);width:22px;border-radius:4px}
.onb-dots i.done{background:var(--plate);opacity:.5}
.onb-c h1{margin:4px 0 8px}
.onb-nav{display:flex;gap:10px;margin:14px 0 28px}
.onb-nav .btn{flex:1}
.onb .bnrow{grid-template-columns:48px 1fr}
.onb .rb:not(.del){background:var(--stage)}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;font-weight:700;letter-spacing:.005em;margin:0}
h1{font-size:2.6rem;line-height:1}
h2{font-size:1.75rem;line-height:1.05}
h3{font-size:1.3rem;line-height:1.1}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:.5em;width:100%;min-height:56px;border-radius:14px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.35rem;letter-spacing:.01em}
.btn.primary{background:var(--plate);color:var(--on-plate)}
.btn.ghost{border:2px solid var(--ink)}
.btn.quiet{min-height:44px;font-size:1.1rem;color:var(--muted)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.card{background:var(--surface);border-radius:22px;padding:18px;margin:14px 0}
.stage{background:var(--stage);border-radius:18px;display:block;width:100%;height:auto}
.stage .floor{stroke:var(--line);stroke-width:2}
.stage .limb{fill:var(--fig);stroke:none}
.stage .limb.far{fill:var(--far)}
.stage .trunk{fill:var(--fig);stroke:var(--fig);stroke-width:1;stroke-linejoin:round}
.stage .head{fill:var(--fig)}
.stage .face{fill:var(--stage)}
.stage .hair{fill:#5F5A63}
.bmap .hairm{fill:#5F5A63}
.bmap .tie{fill:var(--plate)}
.stage .lyr.back{opacity:.6}
.stage .lyr.front{opacity:.96}
.stage .db circle{fill:var(--plate);stroke:none}
.stage .db line{stroke:var(--plate);stroke-width:3.5;stroke-linecap:round}
.stage .db.far{opacity:.55}
.stage .vlbl{font:600 13px Barlow,sans-serif;fill:var(--muted)}
.stage .vdiv{stroke:var(--line);stroke-width:2}
.stage .band{fill:none;stroke:var(--plate);stroke-width:3.5;stroke-linecap:round}
.ask p{font-size:1.15rem;margin:4px 0 16px}
.sheet.ask{z-index:40;align-items:center;padding:16px}
.sheet.ask .in{border-radius:22px;max-width:440px;border:1px solid var(--line)}
.btn.danger{background:var(--oxide);color:#fff}
.timer.prep{color:var(--muted);opacity:.9}
#lbl{min-height:1.5em}
.sbar .back{font-size:2rem;line-height:1;padding-bottom:4px}
.sbar .back:disabled{opacity:.25}
@keyframes tpulse{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
.timer.pulse{animation:tpulse .5s ease-out}
.pv-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.pv-it{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.pv-it b{display:block;font-size:1.05rem;line-height:1.25}
.pv-it .small{line-height:1.35;margin-top:3px}
.pv-stg .stage{border-radius:12px}
.pv-mus{color:var(--muted);margin-top:2px}
.pv-g h2{margin-bottom:10px}
.pv-go{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom,0px));padding:14px 0 10px;background:linear-gradient(to top,var(--bg) 75%,transparent);z-index:2}
.pv-sub{margin:4px 0 0;font-weight:600}
.prv h1{min-width:0;overflow-wrap:anywhere;hyphens:auto}
.prv .pv-x{align-self:flex-start;margin-top:4px}
.nmin{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.nmin:focus{outline:none;border-color:var(--plate-t)}
.eqhint{border:2px solid var(--plate)}
.eqhint h3{color:var(--plate-t);margin-bottom:4px}
.eqhint .btn{margin-top:12px}
.stage .bar{stroke:var(--plate);stroke-width:5;stroke-linecap:round}
.stage .mat{fill:var(--plate)}
.stage .bench{fill:var(--plate)}
.stage .ball{fill:var(--plate)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 4px}
.date{font-size:clamp(2.4rem,11vw,3.4rem);line-height:.95}
.list{list-style:none;padding:0;margin:8px 0 0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .k{color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateZ(0);-webkit-transform:translateZ(0)}
.tabs .in{max-width:560px;margin:0 auto;display:flex}
.tabs button{flex:1;padding:12px 0 14px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.15rem;font-weight:600;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--plate-t)}
.target span{font-size:1.5rem;font-weight:600}
body.in-session .stage{max-height:none}
body.in-session #app>div>h2,body.in-session #app>h2{min-height:2.4em;line-height:1.2;margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.in-session .stg:not(.next .stg){height:min(36vh,280px);display:flex;align-items:stretch}
body.in-session .stg:not(.next .stg)>svg{width:100%;height:100%}
.slot{height:2.5rem;display:flex;align-items:center;justify-content:center;text-align:center}
.slot .sides{margin:0;flex:1}
.slot-t{margin:0;font-weight:700;font-size:1.15rem;color:var(--plate-t)}
.level{display:flex;gap:4px;margin-top:3px}
.level i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.level i.on{background:var(--plate)}
.level i.x{background:var(--oxide);opacity:.5}
/* library */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:7px 14px;border-radius:99px;border:2px solid var(--line);font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#days .chip[aria-pressed="true"],#sexc .chip[aria-pressed="true"],#thc .chip[aria-pressed="true"],#goalc .chip[aria-pressed="true"],#avc .chip[aria-pressed="true"]{background:var(--plate);color:var(--on-plate);border-color:var(--plate-t)}
.ex-row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 0;border-top:1px solid var(--line)}
.ex-item{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.ex-item .ex-row{border-top:0;flex:1;min-width:0}
.ex-item.excl .ex-row{opacity:.45}
.xbtn{flex:none;padding:7px 10px;border-radius:99px;border:2px solid var(--line);font-size:.8rem;font-weight:600;color:var(--muted)}
.xbtn[aria-pressed="true"]{border-color:var(--plate-t);color:var(--plate-t)}
.ex-row svg{width:84px;flex:none}
.ex-row b{font-family:"Barlow Condensed",sans-serif;font-size:1.2rem;display:block;line-height:1.1}
.tag{display:inline-block;font-size:.78rem;padding:1px 8px;border-radius:99px;background:var(--stage);color:var(--muted);margin-right:4px}
.tag.x{background:var(--plate);color:var(--on-plate)}
/* session */
.sbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--plate);transition:width .3s}
.close{width:44px;height:44px;border-radius:12px;font-size:1.6rem;line-height:1;color:var(--plate-t)}
.phase{color:var(--muted);font-weight:600;margin:12px 0 2px}
.target{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:3.2rem;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.timer{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:6.2rem;line-height:1;font-variant-numeric:tabular-nums;text-align:center;margin:8px 0}
.timer.go{color:var(--plate-t)}
.sides{display:flex;justify-content:center;gap:10px;margin:-2px 0 12px}
.sides span{padding:5px 12px;border-radius:99px;border:2px solid var(--line);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.sides span.on{border-color:var(--plate-t);color:var(--plate-t)}
.sides span.ok{color:var(--plate-t);border-color:var(--plate-t)}
.stage .bottle{fill:var(--plate)}
.stage .sweat{fill:var(--fig)}
.reststg .stage{max-height:28vh}
.timer.rest{color:var(--muted)}
details{margin:12px 0;background:var(--surface);border-radius:14px;padding:4px 14px}
summary{padding:10px 0;font-weight:600;cursor:pointer}
details ol{margin:0 0 10px;padding-left:1.2em}
details li{margin:4px 0}
.cue{border-left:4px solid var(--plate);padding:2px 10px;margin:8px 0 12px}
.next{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px;margin:12px 0}
.next svg{width:110px;flex:none}
.fb{margin:14px 0;padding:14px;background:var(--surface);border-radius:18px}
.hint{font-size:.95rem;margin:10px 0 0;min-height:2.8em}
.fbr{width:100%;margin:16px 0 6px;-webkit-appearance:none;appearance:none;height:12px;border-radius:6px;background:linear-gradient(90deg,#4A78B5,var(--sage) 50%,var(--oxide));outline-offset:6px}
.fbr::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--plate);border:3px solid var(--ink);cursor:pointer}
.fbr::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--plate);border:3px solid var(--ink);cursor:pointer}
.fbr:disabled{opacity:.35}
.fbl{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.swap{display:block;margin:10px auto 0;color:var(--plate-t);font-weight:600;padding:8px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,22,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
input[type=date]{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.sync{font-size:.8rem;color:var(--muted)}
.brand{background:var(--bg);color:var(--ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:25}
.sheet.top{align-items:flex-start;z-index:22;background:transparent;padding:6px 8px 0}
.sheet.top .in{overscroll-behavior:contain;border-radius:22px;max-height:calc(100% - 16px);padding-bottom:22px;box-shadow:0 12px 30px rgba(0,0,0,.45);border:1px solid var(--line)}
.gear[aria-expanded="true"]{background:var(--hov2)}
.brand .in{max-width:560px;margin:0 auto;padding:10px 12px 10px 18px;display:flex;align-items:center;justify-content:space-between;min-height:56px}
.wm{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.6rem;letter-spacing:.06em;line-height:1.1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:calc(100% - 56px)}
.wm .y{color:var(--plate-t)}
.gear{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--plate-t)}
.gear svg{width:26px;height:26px}
.gear:hover{background:var(--hov)}
body.in-session .gear{display:none}
h3.sub{font-size:1.15rem;margin:16px 0 6px}
.bmap svg{width:100%;height:auto;display:block;max-height:340px}
.bmap .sil{fill:var(--sil)}
.bmap .feat{fill:var(--feat)}
.bmap .feat .spine{fill:none;stroke:var(--feat);stroke-width:1.4;stroke-linecap:round}
.bmap .bml{font-size:13px}
.bmap .moff{fill:var(--off)}
.bmap .mon{fill:var(--plate-m)}
.bmap .bml{font:700 13px Barlow,sans-serif;fill:var(--ink);text-anchor:middle}
.mleg p{margin:4px 0;font-size:.95rem}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--plate-m);margin-right:8px;vertical-align:-1px}
.sw.s2{opacity:.65}.sw.s1{opacity:.35}
.areas{display:grid;gap:8px}
.ar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:.95rem}
.ar .tag{grid-column:2/4;justify-self:start;margin-top:-4px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.mn{color:var(--muted);font-variant-numeric:tabular-nums}
.tag.foc{background:var(--plate);color:var(--on-plate)}
.prog5{display:grid;gap:14px;margin-top:10px}
.prh{display:flex;justify-content:space-between;align-items:baseline}
.pv{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.5rem;color:var(--sage);font-variant-numeric:tabular-nums}
.pv.neg{color:var(--oxide)}
.pbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0}
.pbar i{display:block;height:100%;background:var(--sage)}
.pbar i.neg{background:var(--oxide)}
.prs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;margin:12px 0 8px}
.wnav button{width:44px;height:44px;border:0;background:transparent;color:var(--plate-t);font-size:2.2rem;font-weight:700;line-height:1;display:grid;place-items:center}
.calcard{margin-top:6px}
.calcard .date{margin-bottom:4px}
.calcard .weekstrip{margin-bottom:0}
.wnav .wl{text-align:center;font-weight:600}
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:0 0 14px;align-items:center}
.wd{border-radius:10px;padding:6px 1px;text-align:center;font-size:.62rem;overflow:hidden;border:2px solid transparent;position:relative;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.wd b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.1rem;line-height:1}
.wd span{display:block;color:var(--muted)}
.wd.st{aspect-ratio:1/1;background:var(--surface);border:2px solid var(--line)}
.wd.tr{min-height:74px;background:var(--surface);border-color:var(--wdb)}
.wd.st .ty{font-size:.58rem;white-space:nowrap}
.wd.st{padding-left:0;padding-right:0}
.wd.tr b{font-size:1.35rem}
.wd.tr .ty{color:var(--ink);font-weight:700}
.wd .ck{width:20px;height:20px;margin-top:2px}
.wd .ck{color:var(--plate-t);width:24px;height:24px}
.wd.st.done{aspect-ratio:auto;min-height:74px}
.wkwrap{overflow:hidden;touch-action:pan-y;padding:4px;margin:-4px}
.wd.today{outline:2px solid var(--plate);outline-offset:2px}
.wd .dm{font-size:.56rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wd.st{gap:0;padding-top:2px;padding-bottom:2px}
.wd.st b{font-size:1rem}
.wd.st span{line-height:1.15}
.wd.st .dm{font-size:min(.5rem,2.1vw)}
.wd.st .ty{font-size:min(.58rem,2.35vw)!important}
.wd.tr .ty{font-size:min(.62rem,2.4vw)!important;letter-spacing:-.01em}
.wd.tr .dm{font-size:min(.62rem,2.6vw)!important}

.wd.tr .dm{color:var(--ink);font-size:.62rem}
.sopt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.sopt button{min-height:46px;border-radius:12px;border:2px solid var(--line);font-weight:600;font-size:.9rem;padding:4px 2px;line-height:1.15}
.sopt button[aria-pressed="true"]{background:var(--plate);color:var(--on-plate);border-color:var(--plate-t)}
.sohint{margin:8px 0 0;color:var(--muted);min-height:1.2em}
.chbox{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart .ca{stroke:var(--muted);stroke-width:1.2}
.chart .cg{stroke:var(--line);stroke-width:1}
.chart .c100{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart .ct{font:500 11px Barlow,sans-serif;fill:var(--muted)}
.chart .cax{font:700 11px Barlow,sans-serif;fill:var(--ink)}
.chart .cl{fill:none;stroke:var(--plate);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .cd{fill:var(--plate);stroke:var(--bg);stroke-width:1.5}
.dur{display:flex;align-items:center;gap:14px}
.durr{flex:1;accent-color:var(--plate-t);height:28px}
.dur output{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.6rem;min-width:70px;text-align:right}
.stepper{display:grid;grid-template-columns:72px 1fr 72px;gap:10px;align-items:center;margin:10px 0 14px}
.stepper span{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:4rem;text-align:center;font-variant-numeric:tabular-nums}
.stepper .btn{font-size:2rem}
.opts{display:grid;gap:8px;margin:12px 0 16px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);font-weight:600}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.dbrow{display:grid;grid-template-columns:40px 80px 40px 1fr 30px;gap:5px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.dbrow:first-child{border-top:0}
.rb{width:40px;height:40px;border-radius:10px;background:var(--surface);font-size:1.4rem;line-height:1;touch-action:manipulation;user-select:none}
.rb.del{background:none;color:var(--muted);width:30px}
.kg{white-space:nowrap;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.3rem;text-align:center;font-variant-numeric:tabular-nums}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:8px 2px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dbt{margin:2px 0 6px;font-weight:600;color:var(--plate-t)}
.bnrow{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:8px;padding:6px 0}
.bnl{font-weight:700}
details.eqd{margin:16px 0 4px;padding:2px 14px 10px}
.accs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 4px}
.acc{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font:inherit;font-size:.85rem;padding:6px 0;border-radius:12px;cursor:pointer}
.acc i{width:40px;height:40px;border-radius:50%;display:block;border:3px solid transparent;box-shadow:0 0 0 2px var(--surface)}
html[data-theme="light"] .acc i{box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.acc[aria-pressed="true"] i{border-color:var(--ink)}
.acc[aria-pressed="true"] span{font-weight:700}
.verl{margin:14px 0 0;padding-left:2px}
.tipbox{position:absolute;left:10px;right:10px;top:10px;z-index:2;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--surface) 92%,transparent);border-left:4px solid var(--plate);font-size:.95rem;line-height:1.35}
.reststg.has-tip>svg{padding-top:84px;box-sizing:border-box}
.tipbox .tipk{font-weight:700;color:var(--plate-t);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
.tipbox p{margin:4px 0 0;transition:opacity .25s}
.codebox{width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0 10px;resize:vertical;word-break:break-all}
#goalc .chip[aria-pressed="true"]:not(.prim){background:transparent;color:var(--ink);border-color:var(--plate)}
.goalchip small{display:block;font-size:.7rem;font-weight:600;opacity:.8;line-height:1;margin-top:2px}
.pfg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.pfbd{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.95rem;margin-top:14px}
.pfi input[type=date]{color-scheme:dark;min-height:24px}
.pfi i:empty{display:none}
.pfi i{white-space:nowrap}
.pfg label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.95rem}
.pfi{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:0 10px}
.pfi:focus-within{border-color:var(--plate-t)}
.pfi input{width:100%;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:1.1rem;padding:10px 0;outline:none;-moz-appearance:textfield}
.pfi input::-webkit-outer-spin-button,.pfi input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pfi i{font-style:normal;color:var(--muted);font-size:.9rem}
details.eqd summary{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.25rem;padding:12px 0}
details.eqd h3.sub:first-of-type{margin-top:4px}
details.eqd .rb:not(.del){background:var(--stage)}
details.eqd .bnrow{grid-template-columns:48px 1fr}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}

<script>
"use strict";

const GOALS={
  fit:{n:'Allgemeine Fitness',d:'Ausgewogenes Training aus Kraft, Ausdauer, Schnelligkeit, Beweglichkeit und Koordination.',w:{K:1,A:1,S:1,B:1,C:1}},
  muscle:{n:'Muskelaufbau',d:'Deutlich mehr Krafttraining mit längeren Satzpausen, dafür weniger Intervalle und Dehnen.',w:{K:1.7,A:.6,S:.7,B:.75,C:.7},rest:20},

  endur:{n:'Ausdauer',d:'Mehr Intervalle mit langen Belastungsphasen, etwas weniger Kraft.',w:{K:.8,A:1.7,S:1,B:.8,C:.7},hiit:{w:10,r:0}},
  mobil:{n:'Beweglichkeit',d:'Viel mehr Dehn- und Mobilisationsübungen, mehr Koordination, weniger Intervalle.',w:{K:.8,A:.65,S:.7,B:1.9,C:1.1}},
  back:{n:'Haltung und Rücken',d:'Ziehende Übungen statt drückender, mehr Rumpf, mehr Dehnen für Hüfte, Brust und Wirbelsäule.',w:{K:1.1,A:.7,S:.6,B:1.4,C:1.1},swap:{pushH:'pullH',pushV:'pullV',abd:'core'},stretch:['d_hip','d_chest','d_catcow','d_child','d_sphinx']}
};

  const w={};for(const a of['K','A','S','B','C'])w[a]=(P.w[a]??1)*sec.reduce((m,g)=>m*Math.pow(g.w[a]??1,SW),1);

function goalChips(){const ks=S.goals||['fit'];return Object.entries(GOALS).map(([k,g])=>{const i=ks.indexOf(k);return `<button class="chip goalchip${i===0?' prim':''}" data-g="${k}" aria-pressed="${i>=0}">${g.n}${i===0?'<small>Hauptziel</small>':i>0?'<small>Nebenziel</small>':''}</button>`}).join('')}
function goalText(){const ks=S.goals||['fit'],sec=ks.slice(1).map(k=>GOALS[k].n);return `<b>Hauptziel: ${esc(GOALS[ks[0]].n)}.</b> ${esc(GOALS[ks[0]].d)}${sec.length?` <br><b>Nebenziel${sec.length>1?'e':''}:</b> ${esc(sec.join(' und '))}. Sie fließen schwächer in die Planung ein.`:' Du kannst bis zu zwei Nebenziele dazunehmen.'}`}
function bindGoals(root){root.querySelectorAll('#goalc .chip').forEach(b=>b.onclick=()=>{const k=b.dataset.g;let ks=(S.goals||['fit']).slice();
  if(ks.includes(k)){if(ks.length>1)ks=ks.filter(x=>x!==k)}else if(ks.length<3)ks.push(k);else{b.animate&&b.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:220});return}
  S.goals=ks;save();const c=document.getElementById('goalc');c.innerHTML=goalChips();document.getElementById('goalt').innerHTML=goalText();bindGoals(document)})}
const ACCENTS=[['Gelb','#F0B323'],['Orange','#FF8A00'],['Rot','#FF5A4F'],['Pink','#FF7AC6'],['Violett','#BC7CFF'],['Blau','#6CC0FF'],['Türkis','#2ED3BE'],['Limette','#A2CF36']];
const L={T:46,N:5,HR:8.7,UA:25,FA:25,TH:36,SH:36};
const VB_W=240,VB_H=210,FLOOR=198,CY=FLOOR-5,BAR=30,BALL=26,D2R=Math.PI/180;
const DEF={t:0,tb:0,hd:0,ua:180,fa:180,th:180,sh:180,al:1,air:0,us:1,ls:1,uab:0,fab:0,tab:0,sab:0,sd:0,fo:0,fo2:0,gr:0};
const LIMB=['ua','fa','th','sh','uab','fab','tab','sab'];
const KEYS=['t','tb','hd','al','air','us','ls','sd','fo','fo2','gr',...LIMB,...LIMB.map(k=>k+'2')];
function dir(a){const r=a*D2R;return[Math.sin(r),-Math.cos(r)]}
function mv(p,a,len){const d=dir(a);return[p[0]+d[0]*len,p[1]+d[1]*len,p[2]||0]}
function seg(P,a,b,len,side){const r=a*D2R,q=b*D2R;return[P[0]+Math.sin(r)*Math.cos(q)*len,P[1]-Math.cos(r)*Math.cos(q)*len,(P[2]||0)+Math.sin(q)*len*side]}
function norm(p,front){
  const o=Object.assign({},DEF,p);
  for(const k of LIMB){if(p[k+'2']===undefined)o[k+'2']=(front&&k.length===2)?-o[k]:o[k]}
  return o;
}
// Seitenansicht: x = vorn, y = unten, z = rechts (zum Betrachter). Frontal definierte Übungen: x = seitlich.
function fk(p,front){
  const hip=[0,0,0];
  const mid=mv(hip,p.t,L.T/2), sh=mv(mid,p.t+p.tb,L.T/2);
  const ha=p.t+p.tb+p.hd, neck=mv(sh,ha,3.4), head=mv(neck,ha,9.4);
  let sR,sL,hR,hL;
  const dn=dir(p.t+p.tb+180),tdn=[dn[0],dn[1],0];
  const drop=(ua,uab)=>{const v=seg([0,0,0],ua,front?0:uab,1,1),c=front?(Math.sin(ua*D2R)*0+(-Math.cos(ua*D2R))*1):(v[0]*tdn[0]+v[1]*tdn[1]);
    const elev=front?Math.abs(nrm(ua-180)):Math.acos(Math.max(-1,Math.min(1,c)))/D2R;return 8.4-7.9*clamp((elev-50)/110,0,1)+(p.sd||0)};
  const dR=drop(p.ua,p.uab),dL=drop(front?-p.ua2:p.ua2,p.uab2);
  const SW=fem()?15:17.5,HW=fem()?7.8:7;
  if(front){sR=[sh[0]+SW+dn[0]*dR,sh[1]+dn[1]*dR,0];sL=[sh[0]-SW+dn[0]*dL,sh[1]+dn[1]*dL,0];hR=[HW,0,0];hL=[-HW,0,0]}
  else{sR=[sh[0]+dn[0]*dR,sh[1]+dn[1]*dR,SW];sL=[sh[0]+dn[0]*dL,sh[1]+dn[1]*dL,-SW];hR=[0,0,HW];hL=[0,0,-HW]}

  const e=seg(sR,p.ua,p.uab,ul,1), w=seg(e,p.fa,p.fab,fl,1);
  const e2=seg(sL,p.ua2,p.uab2,ul,-1), w2=seg(e2,p.fa2,p.fab2,fl,-1);
  const k=seg(hR,p.th,p.tab,L.TH,1), f=seg(k,p.sh,p.sab,L.SH*p.ls,1);
  const k2=seg(hL,p.th2,p.tab2,L.TH,-1), f2=seg(k2,p.sh2,p.sab2,L.SH*p.ls,-1);
  return{hip,mid,sh,neck,head,sR,sL,hR,hL,e,w,e2,w2,k,f,k2,f2};
}
function place(J,ex,X){
  const a=ex.anchor||{j:'f'};let dx,dy;
  if(a.low){
    let my=-1e9;for(const n in J){const y=J[n][1]+(n==='head'?L.HR:0);if(y>my)my=y}
    dx=X-J.hip[0];dy=CY-my;
  }else{
    const p=J[a.j||'f'];const y=a.y!==undefined?a.y:CY-(a.lift||0);
    dx=X-p[0];dy=y-p[1];
  }
  const out={};for(const n in J)out[n]=[J[n][0]+dx,J[n][1]+dy,J[n][2]||0];
  return out;
}
function viewsOf(ex){return ex.front?['front2d']:(ex.views||['side'])}
function prep(ex){
  if(ex._f)return;
  ex._f=ex.frames.map(p=>norm(p,ex.front));
  let mn=1e9,mx=-1e9,zn=1e9,zx=-1e9;
  ex._f.forEach((p,i)=>{const J=place(fk(p,ex.front),ex,0);for(const n in J){const r=n==='head'?L.HR:4;mn=Math.min(mn,J[n][0]-r);mx=Math.max(mx,J[n][0]+r);zn=Math.min(zn,-J[n][2]-r);zx=Math.max(zx,-J[n][2]+r)}
    for(const pr of ex.props||[]){if(pr.t==='bench'&&i===0){const xs=pr.js.map(j=>J[j][0]);mn=Math.min(mn,Math.min(...xs)-pr.l);mx=Math.max(mx,Math.max(...xs)+pr.r)}
      if(pr.t==='ball'){const bx=pr.j==='ew'?(J.e[0]+J.w[0])/2:J[pr.j][0];mn=Math.min(mn,bx-BALL);mx=Math.max(mx,bx+BALL)}}});
  ex._X=VB_W/2-(mn+mx)/2;
  ex._XF=VB_W/2-(zn+zx)/2;
  const n=ex._f.length,tm=ex.tm||{};
  ex._tl=[];
  for(let i=0;i<n;i++){
    const hold=Array.isArray(tm)?tm[i*2]:(tm.h??(n>2?.2:.45));
    const move=Array.isArray(tm)?tm[i*2+1]:(tm.m??(n>2?.8:1.1));
    if(hold>0)ex._tl.push({a:i,b:i,d:hold});
    ex._tl.push({a:i,b:(i+1)%n,d:move});
  }
  ex._T=ex._tl.reduce((s,x)=>s+x.d,0);
  ex._tl.forEach((s,i)=>s.i=i);
  planContacts(ex);

const ease=x=>.5-.5*Math.cos(Math.PI*x);
function poseAt(ex,time){
  if(ex._f.length===1){ex._seg={a:0,b:0,u:0};return ex._f[0]}
  let t=time%ex._T;
  for(const s of ex._tl){
    if(t<=s.d){ex._seg={a:s.a,b:s.b,u:s.a===s.b?0:ease(t/s.d),i:s.i};const A=ex._f[s.a],B=ex._f[s.b];if(s.a===s.b)return A;const u=ease(t/s.d),o={};for(const k of KEYS)o[k]=A[k]+(B[k]-A[k])*u;return o}
    t-=s.d;
  }

// Bodenkontakte: Stützpunkte bleiben stehen, Schwungfüße heben ab, beidbeinige Wechsel werden zum Sprung
function planContacts(ex){
  ex._seg2=null;
  if(ex._f.length<2||ex.legIK||(ex.anchor&&(ex.anchor.y===BAR||ex.anchor.lift)))return;const IK=!!ex.ik;
  const P=ex._f.map(q=>place(fk(q,ex.front),ex,ex._X)),gnd=(J,q)=>J[q][1]>=CY-2.5,n=ex._f.length;
  const C=new Array(n).fill(null);C[0]=0;const info=[];let any=false;
  for(const s of ex._tl){
    const Ca=C[s.a]??0;
    if(s.a===s.b){info.push({Ca});continue}
    const A=P[s.a],B=P[s.b];let c=null,jump=0;const lift=[];
    if(IK){
      for(const q of['w','w2']){if(ex.ik.includes(q==='w'?'n':'f'))continue;if(!(gnd(A,q)||gnd(B,q)))continue;const d=Math.hypot(A[q][0]-B[q][0],A[q][2]-B[q][2]);if(d>4)lift.push([q,Math.min(10,3+.22*d)])}
    }else if(!ex.front){
      if(gnd(A,'w')&&gnd(B,'w')&&gnd(A,'w2')&&gnd(B,'w2'))c='w';
      else{let best=null;for(const q of['f','f2'])if(gnd(A,q)&&gnd(B,q)){const d=Math.abs(A[q][0]-A.hip[0]-(B[q][0]-B.hip[0]));if(!best||d<best.d)best={q,d}}if(best)c=best.q}
      if(c&&c[0]==='f'){const other=c==='f'?'f2':'f';const dz=Math.abs(A[c][2]-B[c][2]),dzo=Math.abs(A[other][2]-B[other][2]);
        if(dz>3&&gnd(A,other)&&gnd(B,other)&&dzo>3){jump=Math.min(9,.35*Math.max(dz,dzo));c=null}}
    }else{
      const m=q=>gnd(A,q)&&gnd(B,q)?Math.abs(A[q][0]-A.hip[0]-(B[q][0]-B.hip[0])):0;
      if(m('f')>3&&m('f2')>3)jump=Math.min(9,.35*Math.max(m('f'),m('f2')));
    }
    const Cb=c?Ca+A[c][0]-B[c][0]:Ca;
    if(C[s.b]===null)C[s.b]=Cb;
    if(!jump&&!IK&&!ex.front&&c!=='w')for(const q of['w','w2']){if(!(gnd(A,q)||gnd(B,q)))continue;const d=Math.hypot(A[q][0]+Ca-(B[q][0]+(c?Ca+A[c][0]-B[c][0]:Ca)),A[q][2]-B[q][2]);if(d>4)lift.push([q,Math.min(10,3+.22*d)])}
    if(!jump&&!IK)for(const q of['f','f2']){if(q===c)continue;if(!(gnd(A,q)||gnd(B,q)))continue;
      const d=Math.hypot(A[q][0]+Ca-(B[q][0]+Cb),A[q][2]-B[q][2]);if(d>4)lift.push([q,Math.min(15,3+.26*d)])}
    const R=s.b===0?Cb-C[0]:(C[s.b]!==null&&C[s.b]!==Cb?Cb-C[s.b]:0);
    if(IK)c=null;
    if(c||jump||lift.length||Ca)any=true;
    info.push({c,Ca,Pa:c?A[c][0]:0,Ya:c?A[c][1]:0,Yb:c?B[c][1]:0,jump,lift,R});
  }
  if(!any)return;
  let mn=1e9,mx=-1e9;P.forEach((J,i)=>{for(const k in J){mn=Math.min(mn,J[k][0]+(C[i]||0)-4);mx=Math.max(mx,J[k][0]+(C[i]||0)+4)}});
  const sh=VB_W/2-(mn+mx)/2;if(Math.abs(sh)>.5&&!(ex.props&&ex.props.length)){ex._X+=sh;info.forEach(I=>{if(I.c)I.Pa+=sh})}
  ex._seg2=info;
}
function liftFoot(J,fq,h,front){
  if(fq[0]==='w'){const Sk=fq==='w'?'sR':'sL',Ek=fq==='w'?'e':'e2';return liftChain(J,Sk,Ek,fq,h)}
  if(front){const kk=fq==='f'?'k':'k2';J[kk]=[J[kk][0],J[kk][1]-h*.5,J[kk][2]];J[fq]=[J[fq][0],J[fq][1]-h,J[fq][2]];return}
  const H=J[fq==='f'?'hR':'hL'],kk=fq==='f'?'k':'k2',K=J[kk],F=J[fq],a1=Math.hypot(K[0]-H[0],K[1]-H[1],K[2]-H[2]),a2=Math.hypot(F[0]-K[0],F[1]-K[1],F[2]-K[2]);
  const T=[F[0],F[1]-h,F[2]],v=[T[0]-H[0],T[1]-H[1],T[2]-H[2]];let d=Math.hypot(...v)||1;const a=v.map(x=>x/d);d=Math.min(d,a1+a2-.01);
  const x=(a1*a1-a2*a2+d*d)/(2*d),r=Math.sqrt(Math.max(0,a1*a1-x*x));
  if(h<.05)return;const kh=[K[0]-H[0],K[1]-H[1],K[2]-H[2]],dp=kh[0]*a[0]+kh[1]*a[1]+kh[2]*a[2];let pl=[kh[0]-a[0]*dp,kh[1]-a[1]*dp,kh[2]-a[2]*dp];const pn=Math.hypot(...pl);if(pn<1.5){const w=1.5-pn;pl=[pl[0]+w*(1-a[0]*a[0]),pl[1]-w*a[0]*a[1],pl[2]-w*a[0]*a[2]]}const pn2=Math.hypot(...pl)||1;pl=pl.map(x=>x/pn2);

let AC=null;
function beep(f=880,d=.12){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d+.02)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let tick=null,wake=null;
function stopTick(){if(tick){clearInterval(tick);tick=null}}
const READY=5;
function getReady(tm,lbl,go,cb){
  const orig=go.onclick,oldG=go.textContent,oldK=go.className,oldL=lbl?lbl.textContent:'';let left=READY,on=false;
  if(lbl)lbl.textContent='Mach dich bereit!';tm.className='timer prep';go.disabled=false;
  const run=()=>{on=true;go.textContent='Pause';go.className='btn ghost';
    countdown(left,x=>{tm.textContent=x;left=x},()=>{if(lbl)lbl.textContent=oldL;go.textContent=oldG;go.className=oldK;go.onclick=orig;cb()})};
  go.onclick=()=>{if(on){on=false;stopTick();go.textContent='Weiter';go.className='btn primary'}else run()};
  run()}
function pulseTm(){const t=document.getElementById('tm');if(!t||reduceMotion)return;t.classList.remove('pulse');void t.offsetWidth;t.classList.add('pulse')}
function countdown(sec,onTick,onDone,midCb){
  stopTick();requestAnimationFrame(pulseTm);const end=Date.now()+sec*1000;let last=sec,mid=false;
  onTick(sec);
  tick=setInterval(()=>{
    const left=Math.ceil((end-Date.now())/1000);
    if(left!==last){last=left;if(left<=3&&left>0)beep(660,.08);onTick(Math.max(0,left))}
    if(midCb&&!mid&&left<=sec/2){mid=true;midCb()}
    if(left<=0){stopTick();beep(990,.25);buzz([120,60,120]);onDone()}
  },200);
}
function countup(max,onTick,onDone){
  stopTick();const t0=Date.now();let last=-1;onTick(0);
  tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);if(s!==last){last=s;onTick(Math.min(s,max))}if(s>=max){stopTick();beep(990,.25);buzz([120,60,120]);onDone(max)}},200);
  return()=>Math.min(max,Math.floor((Date.now()-t0)/1000));
}

  const run=()=>{running=true;go.textContent='Pause';go.className='btn ghost';tm.className='timer go';mark();if(sd)lbl.textContent=st.phase===0?'Linke Seite':'Rechte Seite';
    countdown(st.left,s=>{tm.textContent=s;st.left=s},()=>{
      if(sd&&st.phase===0){st.phase=1;st.left=half;stg_._st.mirror=actSide(e)!==want();beep(520,.3);buzz(200);tm.textContent=half;run()}else next()})};
  go.onclick=()=>{if(!running){if(!st.rdy){st.rdy=1;getReady(tm,lbl,go,run)}else run()}else{stopTick();running=false;go.textContent='Weiter';go.className='btn primary';tm.className='timer rest'}};
  app.querySelector('#sk').onclick=next;
  const prev=SES.steps[SES.i-1];
  if(prev&&prev.k==='timed'&&prev.ar===st.ar&&st.phase===0&&st.left===(sd?half:st.sec)){st.rdy=1;getReady(tm,lbl,go,()=>{tm.textContent=st.left;run()})}
}
function stSet(st){
  const e=exFor(st),t=target(e,st.chain);
  const c=h(`<p class="phase">${esc(st.ph)}</p><h2>${esc(e.n)}</h2><div class="stg" style="margin-top:10px"></div><p class="target">${tgtHtml(e,t)}</p>${dbText(st.chain,e)?`<p class="dbt">Kurzhanteln: ${dbText(st.chain,e)}</p>`:''}<p class="muted small">Ziel: sauber ausführen, die letzten 2 Wiederholungen sollen fordern.</p>${t.u==='s'?'<div class="timer rest" id="tm">'+t.n+'</div>':''}<div class="row" style="margin-top:10px"><button class="btn primary" id="ok">${t.u==='s'?'Halten starten':'Satz geschafft'}</button></div>${howHtml(e,st.r===1)}<button class="swap" id="nm">Zu schwer? Leichtere Variante zeigen</button>`);
  c.querySelector('.stg').append(makeStage(e));
  app.append(c);
  const ok=app.querySelector('#ok');
  if(t.u==='s'){
    let on=false;ok.onclick=()=>{if(on){next();return}on=true;ok.textContent='Fertig';const tm=app.querySelector('#tm');tm.className='timer go';countdown(t.n,s=>tm.textContent=s,()=>{ok.textContent='Weiter';tm.textContent='Geschafft'})};
  }else ok.onclick=next;
  app.querySelector('#nm').onclick=()=>{
    const msg=applyFb(st.chain,e.id,'down');SES.msgs.push(e.n+': '+msg.replace('Nächstes Mal ','Ab sofort '));
    const r=curEx(st.chain);if(r)SES.cur[st.chain]=r.id;save();render();
  };
}
const TIPS=['Trink ein paar Schlucke Wasser. Schon leichter Flüssigkeitsmangel kostet Kraft.','Atme ruhig und tief: etwa 4 Sekunden ein, 6 Sekunden aus. Das senkt den Puls schneller.','Bleib locker in Bewegung, zum Beispiel ein paar Schritte auf der Stelle. Das hält die Muskeln warm.','Schüttle Arme und Beine kurz aus und lass die Schultern ein paar Mal kreisen.','Geh den nächsten Satz im Kopf durch: Ausgangsposition, Bewegung, Atmung.','Saubere Technik geht vor: Lieber eine Wiederholung weniger als eine unsaubere.','Atme beim Anstrengen aus und beim Zurückgehen ein. Nicht die Luft anhalten.','Brennende Muskeln sind normal. Stechender Schmerz in Gelenken ist ein Signal zum Aufhören.','Trockne kurz die Hände ab, das gibt beim nächsten Satz einen sicheren Griff.','Spann vor dem nächsten Satz den Rumpf an, als würdest du gleich angestupst.','Nutz die Pause wirklich zur Erholung. Volle Kraft im nächsten Satz bringt mehr als Eile.'];
function stRest(st){
  const nx=SES.steps[SES.i+1];const ne=nx&&(nx.chain||nx.ex)?exFor(nx):null;
  const sub=!ne?'':nx.k==='set'?tgtText(ne,target(ne,nx.chain))+(dbText(nx.chain,ne)?', '+dbText(nx.chain,ne):''):nx.k==='speed'?'15 s maximales Tempo':'';
  const c=h(`<p class="phase">Pause</p><h2>Kurz erholen</h2><div class="stg reststg has-tip" style="margin-top:10px;position:relative"><div class="tipbox" aria-live="polite"><span class="tipk">Tipp</span><p id="tip">${esc(TIPS[(SES.i*3)%TIPS.length])}</p></div></div><div class="timer rest" id="tm">${st.sec}</div><div class="slot">${st.why==='max'?'<p class="slot-t">Längere Pause für Maximalkraft</p>':''}</div><p class="muted" id="lbl" style="text-align:center;margin-top:-4px">${st.why==='max'?'Schwere Sätze brauchen mehr Erholung.':' '}</p><div class="row"><button class="btn ghost" id="plus">+15 s</button><button class="btn primary" id="sk">Weiter</button></div>${ne?`<div class="next"><span class="stg"></span><span><span class="muted small">Als Nächstes</span><br><b class="cond" style="font-size:1.3rem">${esc(ne.n)}</b><br><span class="small">${sub}</span></span></div>`:''}`);
  c.querySelector('.reststg').append(makeStage(EX.idle_rest));
  if(ne)c.querySelector('.next .stg').append(makeStage(ne,{single:true}));
  if(st.fb&&SES.cur[st.fb])c.querySelector('.row').after(fbWidget(st.fb));
  app.append(c);
  const tm=app.querySelector('#tm'),tip=app.querySelector('#tip');let left=st.sec,ti=(SES.i*3)%TIPS.length,el=0;
  const go=s=>countdown(s,x=>{if(tip&&x!==left&&++el%15===0){ti=(ti+1)%TIPS.length;tip.style.opacity=0;setTimeout(()=>{tip.textContent=TIPS[ti];tip.style.opacity=1},250)}left=x;tm.textContent=x},next);
  go(st.sec);
  app.querySelector('#plus').onclick=()=>go(left+15);
  app.querySelector('#sk').onclick=next;
}
function stInt(st){
  const e=EX[SES.cur[st.chain]];
  const c=h(`<p class="phase">Ausdauer, Intervall ${st.i+1} von ${st.of}</p><h2 id="nm">${esc(e.n)}</h2><div class="stg" style="margin-top:10px"></div><div class="timer go" id="tm">${st.work}</div><div class="slot">${dbText(st.chain,e)?`<p class="dbt" style="margin:0">Kurzhanteln: ${dbText(st.chain,e)}</p>`:''}</div><p class="muted" id="lbl" style="text-align:center;margin-top:-4px">Belastung ${st.work} s, Pause ${st.rest||0} s</p><div class="row"><button class="btn primary" id="go">Los</button></div>${howHtml(e,st.i<2)}<button class="swap" id="sw">Zu schwer? Leichtere Variante zeigen</button>`);
  c.querySelector('.stg').append(makeStage(e));
  app.append(c);
  const tm=app.querySelector('#tm'),lbl=app.querySelector('#lbl'),go=app.querySelector('#go');
  const work=()=>{go.textContent='Überspringen';go.onclick=next;tm.className='timer go';lbl.textContent='Belastung';
    countdown(st.work,s=>tm.textContent=s,()=>{
      if(!st.rest){next();return}
      const nx=SES.steps[SES.i+1];const ne=nx&&nx.k==='int'?EX[SES.cur[nx.chain]]:null;
      tm.className='timer rest';lbl.textContent=ne?'Pause, gleich: '+ne.n:'Pause';
      {const sg=app.querySelector('.stg');if(sg){sg.innerHTML='';sg.append(makeStage(EX.idle_rest))}}countdown(st.rest,s=>tm.textContent=s,()=>{SES.autoInt=true;next()});
    })};
  go.onclick=()=>getReady(tm,lbl,go,work);
  if(SES.autoInt){SES.autoInt=false;work()}
  app.querySelector('#sw').onclick=()=>{
    stopTick();const msg=applyFb(st.chain,e.id,'down');SES.msgs.push(e.n+': '+msg.replace('Nächstes Mal ','Ab sofort '));
    const r=curEx(st.chain);if(r)SES.cur[st.chain]=r.id;save();render();
  };
}
function stBal(st){
  const e=EX[st.ex];
  const c=h(`<p class="phase">${esc(st.ph)}</p><h2>${esc(e.n)}</h2><div class="stg" style="margin-top:10px"></div><div class="timer rest" id="tm">0</div><div class="slot"><p class="slot-t">Auf dem ${st.side==='links'?'linken':'rechten'} Bein</p></div><p class="muted" id="lbl" style="text-align:center;margin-top:-4px">Starte, sobald du stehst. Höchstens ${BAL_MAX} s.</p><div class="row"><button class="btn primary" id="go">Start</button></div>${howHtml(e,st.r===1&&st.side==='links')}`);
  c.querySelector('.stg').append(makeStage(e,{mirror:stanceSide(e)!==(st.side==='links'?'L':'R')}));
  app.append(c);
  const tm=app.querySelector('#tm'),lbl=app.querySelector('#lbl'),go=app.querySelector('#go');
  let stop=null;
  const fin=v=>{stopTick();SES.bal[st.side].push(v);tm.textContent=v+' s';tm.className='timer rest';lbl.textContent=v>=BAL_MAX?'Maximum erreicht.':'Gespeichert.';go.textContent='Weiter';go.onclick=next};
  go.onclick=()=>getReady(tm,lbl,go,()=>{tm.className='timer go';go.textContent='Abgesetzt';stop=countup(BAL_MAX,s=>tm.textContent=s,fin);go.onclick=()=>fin(stop())});
}
function stSpeed(st){
  const e=EX[st.ex];
  const prevBest=Math.max(0,...(S.meas.sp[st.ex]||[]).map(x=>x[1]));
  const c=h(`<p class="phase">${esc(st.ph)}</p><h2>${esc(e.n)}</h2><div class="stg" style="margin-top:10px"></div><div id="ph1"><div class="timer rest" id="tm">15</div><div class="slot"><p class="slot-t">15 Sekunden, so schnell du kannst</p></div><p class="muted" id="lbl" style="text-align:center;margin-top:-4px">Zähl die Wiederholungen mit.${prevBest?` Bestwert: ${prevBest}.`:''}</p><div class="row"><button class="btn primary" id="go">Los</button></div></div>${howHtml(e,st.i===0)}`);
  c.querySelector('.stg').append(makeStage(e));
  app.append(c);
  const tm=app.querySelector('#tm'),go=app.querySelector('#go'),ph=app.querySelector('#ph1');
  const askCount=()=>{
    let v=SES.sp[st.ex]||prevBest||15;
    ph.innerHTML=`<p class="target" style="font-size:2rem">Wie viele waren es?</p><div class="stepper"><button class="btn ghost" id="m" aria-label="Eins weniger">−</button><span id="v" aria-live="polite">${v}</span><button class="btn ghost" id="p" aria-label="Eins mehr">+</button></div><button class="btn primary" id="sv">Speichern und weiter</button>`;
    const out=ph.querySelector('#v');
    ph.querySelector('#m').onclick=()=>{v=Math.max(0,v-1);out.textContent=v};
    ph.querySelector('#p').onclick=()=>{v=v+1;out.textContent=v};
    ph.querySelector('#sv').onclick=()=>{SES.sp[st.ex]=Math.max(SES.sp[st.ex]||0,v);next()};
  };
  go.onclick=()=>getReady(tm,app.querySelector('#lbl'),go,()=>{go.disabled=true;tm.className='timer go';go.textContent='Läuft';countdown(15,s=>tm.textContent=s,askCount)});
}
function stMob(st){
  const T=MOBT[st.test],e=EX[T.ex];
  const c=h(`<p class="phase">Beweglichkeit messen</p><h2>${esc(T.n)}</h2><div class="stg" style="margin-top:10px"></div><p style="font-size:1.1rem;margin-top:12px">${esc(T.q)}</p><div class="opts">${T.opts.map((o,i)=>`<button class="opt" data-v="${i+1}" aria-pressed="false">${esc(o)}</button>`).join('')}</div><button class="btn primary" id="sv" disabled>Weiter</button>`);
  c.querySelector('.stg').append(makeStage(e,{single:true}));
  app.append(c);
  const sv=app.querySelector('#sv');
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{app.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));SES.mob={test:st.test,v:+b.dataset.v};sv.disabled=false});
  sv.onclick=next;
}
function slider(title,preview,commit,onNm){
  const box=h(`<div class="fb"><span class="muted small">Wie war</span><br><b class="cond" style="font-size:1.4rem">${esc(title)}?</b><input type="range" min="0" max="100" step="1" value="50" class="fbr" aria-label="${esc(title)}: von viel zu leicht bis viel zu schwer"><div class="fbl"><span>viel zu leicht</span><span>passt</span><span>viel zu schwer</span></div><p class="hint"></p>${onNm?'<button class="swap" style="margin:4px 0 0;padding:6px 0">Nicht machbar</button>':''}</div>`).firstChild;
  const p={v:50,title,commit};(SES.pend=SES.pend||[]).push(p);
  const r=box.querySelector('input'),hint=box.querySelector('.hint'),nm=box.querySelector('.swap');
  const upd=()=>{p.v=+r.value;hint.textContent=preview(FB_KIND(p.v))};
  r.addEventListener('input',upd);upd();
  if(nm)nm.onclick=()=>{SES.pend=SES.pend.filter(x=>x!==p);const m=onNm();SES.msgs.push(title+': '+m);save();r.disabled=true;nm.remove();hint.textContent=m};
  return box;
}
function fbWidget(chain){
  const e=EX[SES.cur[chain]];
  return slider(e.n,k=>applyFb(chain,e.id,k,true),k=>applyFb(chain,e.id,k),null);
}
function xWidget(it){
  const e=EX[it.ex],title=it.t==='bal'?'Gleichgewicht ('+e.n+')':e.n;
  return slider(title,k=>applyX(it,k,true),k=>applyX(it,k),null);
}
function commitFb(){
  if(!SES||!SES.pend||!SES.pend.length)return;const list=SES.pend;SES.pend=[];
  for(const p of list){const k=FB_KIND(p.v),m=p.commit(k);if(k!=='keep')SES.msgs.push(p.title+': '+m)}
  save();
}
function stFb(st){
  if(!SES.cur[st.chain]){next();return}
  app.append(h(`<p class="phase">Rückmeldung</p>`));
  app.append(fbWidget(st.chain));
  const b=h(`<button class="btn primary">Weiter</button>`).firstChild;b.onclick=next;app.append(b);
}
function stFbx(st){
  const items=st.items.filter(it=>EX[it.ex]);if(!items.length){next();return}
  app.append(h(`<p class="phase">Rückmeldung: ${esc(st.title)}</p>`));
  items.forEach(it=>app.append(xWidget(it)));
  const b=h(`<button class="btn primary">Weiter</button>`).firstChild;b.onclick=next;app.append(b);
}
function stEnd(){
  const k=SES.dk;
  if(!SES.saved){
    SES.saved=true;
    for(const id in SES.sp){(S.meas.sp[id]=S.meas.sp[id]||[]).push([k,SES.sp[id]])}
    const L=SES.bal.links,R=SES.bal.rechts;
    if(L.length||R.length){
      const bl=L.length?Math.max(...L):0,br=R.length?Math.max(...R):0,lvl=S.balLv;
      S.meas.bal.push([k,balScore((bl+br)/2,lvl),lvl]);
      if(bl>=BAL_MAX&&br>=BAL_MAX&&lvl<2){S.balLv=lvl+1;SES.msgs.push('Gleichgewicht: beide Seiten 45 s. Nächstes Mal: '+EX[BAL[lvl+1]].n)}
      else if(bl<8&&br<8&&lvl>0){S.balLv=lvl-1;SES.msgs.push('Gleichgewicht: nächstes Mal wieder '+EX[BAL[lvl-1]].n)}
    }
    if(SES.mob)(S.meas.mob[SES.mob.test]=S.meas.mob[SES.mob.test]||[]).push([k,SES.mob.v]);
    const items=[...new Set(SES.steps.filter(s=>['set','int','speed','bal','timed'].includes(s.k)).map(s=>s.ex?EX[s.ex]:EX[SES.cur[s.chain]]).filter(Boolean).map(e=>e.n))];
    S.done[k]={t:SES.type,min:Math.round((Date.now()-SES.t0)/60000),items,ar:areaTime(SES),mg:loadsOf(SES)};S.cnt++;
    const snap={d:k,K:valK(),A:valA()};const last=S.hist[S.hist.length-1];
    if(last&&last.d===k)S.hist[S.hist.length-1]=snap;else S.hist.push(snap);
    save();keepAwake(false);
  }
  const nx=nextTrainDate(today());
  app.append(h(`<h1 style="margin-top:10px">Erledigt.</h1><p class="target" style="font-size:2.4rem">${S.done[k].min} Minuten</p>`));
  app.append(h(progressCard('Dein Fortschritt')));
  app.append(h(`<section class="card"><h3>Anpassungen für das nächste Mal</h3>${SES.msgs.length?`<ul class="list">${SES.msgs.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`:'<p class="muted">Keine Stufenänderung, alles passte.</p>'}</section>${nx?`<p class="muted">Nächstes Training: ${SESS[nextType()].n} am ${fmt(nx)}.</p>`:''}`));
  const b=h(`<button class="btn primary">Fertig</button>`).firstChild;b.onclick=endSession;app.append(b);
}
function stDend(st){
  const k=SES.dk;if(!S.done[k])S.done[k]={t:'D'};save();keepAwake(false);
  app.append(h(`<h1 style="margin-top:10px">Erledigt.</h1>${SES.msgs.length?`<section class="card"><h3>Anpassungen für das nächste Mal</h3><ul class="list">${SES.msgs.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></section>`:'<p class="muted">Alles passte, die Lockerung bleibt so.</p>'}`));
  const b=h(`<button class="btn primary" style="margin-top:16px">Fertig</button>`).firstChild;b.onclick=endSession;app.append(b);
}
render();
</script>
